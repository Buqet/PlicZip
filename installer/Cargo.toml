[package]
name = "pliczip-installer"
version = "1.26.106"
edition = "2021"

[lib]
name = "pliczip_installer"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
installrs = { version = "0.1.1", features = ["gui"] }
sys-locale = "0.3"

[package.metadata.installrs]
gui = true
subsystem = "windows"
execution-level = "asInvoker"
dpi-aware = "permonitorv2"
supported-os = ["7", "8", "8.1", "10"]
product-name = "PlicZip"
file-description = "PlicZip Setup"
product-version = "1.26.106"
file-version = "1.26.106"
company-name = "PlicZip"
legal-copyright = "Copyright (c) 2026 PlicZip contributors"

[package.metadata.installrs.installer]
original-filename = "PlicZip-Setup.exe"

[package.metadata.installrs.uninstaller]
file-description = "PlicZip Uninstaller"
original-filename = "uninstall.exe"
