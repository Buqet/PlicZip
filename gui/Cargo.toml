[package]
name = "pliczip-gui"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Графическая оболочка PlicZip на egui"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
pliczip = { path = ".." }
eframe = "0.37"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
rfd = "0.17"

[build-dependencies]
# Иконки и сведения о версии в ресурсах exe (только при сборке под Windows).
embed-resource = "3"

[target.'cfg(windows)'.dependencies]
# Реестр и SHChangeNotify для интеграции с Проводником (уже есть в дереве через winit).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Registry", "Win32_UI_Shell"] }
