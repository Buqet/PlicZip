[package]
name = "pliczip-gui"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Графическая оболочка PlicZip на egui"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
pliczip = { path = ".." }
eframe = "0.37"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
rfd = "0.17"
