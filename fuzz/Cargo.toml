[package]
name = "pliczip-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
pliczip = { path = ".." }
tempfile = "3"

[[bin]]
name = "paths"
path = "fuzz_targets/paths.rs"
test = false
doc = false
bench = false

[[bin]]
name = "open"
path = "fuzz_targets/open.rs"
test = false
doc = false
bench = false
