[workspace]
members = ["gui"]
resolver = "2"

[package]
name = "pliczip"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
description = "PlicZip — архиватор с собственным форматом .plz"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["archive", "compression", "brotli", "cli"]
categories = ["command-line-utilities", "compression"]

[[bin]]
name = "pliczip"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake3 = { version = "1", features = ["pure"] }
ciborium = "0.2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
brotli = "7"
walkdir = "2"
filetime = "0.2"
rayon = "1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
getrandom = "0.2"
zeroize = "1"
rpassword = "7"
reed-solomon-simd = "3.1"

[profile.release]
lto = true
codegen-units = 1

[dev-dependencies]
blake3 = { version = "1", features = ["pure"] }
