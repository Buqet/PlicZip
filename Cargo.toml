[workspace]
members = ["gui"]
exclude = ["fuzz", "installer"]
resolver = "2"

[package]
name = "pliczip"
version = "1.26.103"
edition = "2021"
rust-version = "1.89"
description = "PlicZip — архиватор с собственным форматом .plz"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["archive", "compression", "brotli", "cli"]
categories = ["command-line-utilities", "compression"]

[[bin]]
name = "pliczip"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake3 = { version = "1", features = ["pure"] }
ciborium = "0.2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
brotli = "7"
walkdir = "2"
filetime = "0.2"
rayon = "1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
getrandom = "0.2"
zeroize = "1"
rpassword = "7"
reed-solomon-simd = "3.1"
ureq = { version = "2.12", default-features = false, features = ["json", "tls"] }
sevenz-rust = { version = "0.6.1", default-features = false, features = ["compress", "aes256", "bzip2", "zstd"] }
rars = { version = "0.12.4", default-features = false, features = ["encryption"] }
zip = { version = "9.5", default-features = false, features = ["aes-crypto", "deflate-flate2-zlib-rs", "time"] }
tar = { version = "0.4", default-features = false }

[profile.release]
lto = true
codegen-units = 1
