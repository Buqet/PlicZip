name: Release

# Собирает бинарники CLI и GUI под Linux, Windows и macOS и прикладывает их
# к GitHub Release. Запускается на пуш тега `v*` (например `v0.10.111-beta`);
# если релиза для тега ещё нет — создаёт его (теги с `-` — пре-релиз).
# Вручную (Actions → Release → Run workflow) можно доложить бинарники
# в уже существующий релиз.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза, например v0.10.111-beta"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Релиз
    runs-on: ubuntu-latest
    steps:
      - name: Создать релиз, если его нет
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Релиз $TAG уже есть — только доложим бинарники."
          else
            flags=(--generate-notes --verify-tag --title "$TAG")
            case "$TAG" in *-*) flags+=(--prerelease) ;; esac
            if ! gh release create "$TAG" -R "$GITHUB_REPOSITORY" "${flags[@]}"; then
              # Release мог появиться между проверкой и create (например, при
              # ручном создании changelog перед запуском workflow).
              if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                echo "Релиз $TAG появился параллельно — продолжаем загрузку assets."
              else
                exit 1
              fi
            fi
          fi

  build:
    name: Сборка (${{ matrix.target }})
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Системные зависимости (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libgtk-3-dev

      - name: Сборка
        env:
          PLICZIP_RELEASE_TAG: ${{ env.TAG }}
        run: cargo build --release --locked --target ${{ matrix.target }} -p pliczip -p pliczip-gui

      - name: Упаковка
        shell: bash
        run: |
          name="pliczip-${TAG}-${{ matrix.target }}"
          bin="target/${{ matrix.target }}/release"
          ext=""
          [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          mkdir "$name"
          cp "$bin/pliczip$ext" "$bin/pliczip-gui$ext" README.md LICENSE "$name/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            # The GUI is the normal Windows entry point. Keep the old names
            # for compatibility, but provide unambiguous names for users who
            # simply open the first executable in the downloaded archive.
            cp "$bin/pliczip-gui$ext" "$name/PlicZip$ext"
            cp "$bin/pliczip$ext" "$name/pliczip-cli$ext"
            printf '%s\n' \
              'PlicZip Windows package' \
              '' \
              'Double-click PlicZip.exe to start the graphical application.' \
              'pliczip-cli.exe is the command-line version and closes immediately when opened without arguments.' \
              '' \
              'To install Windows Explorer integration, run:' \
              'PlicZip.exe --install-context-menu' \
              > "$name/START-HERE.txt"
            asset="$name.zip"
            7z a -bd "$asset" "$name" >/dev/null
            rm -rf installer/assets
            mkdir -p installer/assets
            cp "$bin/pliczip-gui$ext" installer/assets/PlicZip.exe
            cp "$bin/pliczip$ext" installer/assets/pliczip-cli.exe
            cp LICENSE installer/assets/LICENSE
          else
            asset="$name.tar.gz"
            tar czf "$asset" "$name"
          fi
          if command -v sha256sum >/dev/null; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - name: Установка InstallRS CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo install installrs --version 0.1.1 --locked

      - name: Сборка Windows Setup через InstallRS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          $manifest = Get-Content installer/Cargo.toml -Raw
          $manifest = [regex]::Replace($manifest, '(?m)^version = "[^"]+"$', "version = `"$version`"", 1)
          Set-Content installer/Cargo.toml $manifest -Encoding utf8
          $output = Join-Path $PWD "PlicZip-Setup-v$version.exe"
          installrs build installer --target x86_64-pc-windows-msvc --output $output `
            --metadata "file-version=$version.0" `
            --metadata "product-version=$version.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = "PlicZip-Setup-v$version.exe"
          if (-not (Test-Path $installer)) { throw "Installer was not created: $installer" }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $installer" | Set-Content "$installer.sha256"
          "INSTALLER=$installer" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Загрузка в релиз
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=("$ASSET" "$ASSET.sha256")
          if [ -n "${INSTALLER:-}" ]; then
            files+=("$INSTALLER" "$INSTALLER.sha256")
          fi
          gh release upload "$TAG" "${files[@]}" --clobber -R "$GITHUB_REPOSITORY"
