name: Fuzzing

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Build fuzz targets
        run: cargo fuzz build paths
      - name: Build open fuzz target
        run: cargo fuzz build open
      - name: Run paths fuzz target
        run: cargo fuzz run paths -- -max_total_time=60
      - name: Run open fuzz target
        run: cargo fuzz run open -- -max_total_time=60
