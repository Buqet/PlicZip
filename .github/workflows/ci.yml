name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Проверки качества
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Форматирование
        run: cargo fmt --all -- --check
      - name: Аудит зависимостей
        uses: actions-rust-lang/audit@v1
      - name: Тесты всего workspace
        run: cargo test --workspace

  test:
    name: Тесты (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy всего workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Тесты всего workspace
        run: cargo test --workspace

  fuzz:
    name: Fuzz smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Установить cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Собрать fuzz target полного открытия
        run: cargo fuzz build open
      - name: Fuzz paths (20 секунд)
        run: cargo fuzz run paths -- -max_total_time=20
