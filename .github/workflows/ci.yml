name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Проверки качества
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Форматирование
        run: cargo fmt --all -- --check
      - name: Установка cargo-audit
        run: cargo install cargo-audit --locked
      # Исключение только для известного path traversal в sevenz-rust:
      # PlicZip распаковывает 7z собственным callback и проверяет каждый путь
      # через normalized_path/join_safe до создания файла. Не вызывать здесь
      # sevenz_rust::decompress_*; убрать исключение после замены зависимости.
      - name: Аудит зависимостей
        run: cargo audit --ignore RUSTSEC-2026-0245
      - name: Clippy всего workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    name: Тесты (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Тесты всего workspace
        run: cargo test --locked --workspace

  fuzz:
    name: Fuzz smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Установить cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Собрать fuzz target полного открытия
        run: cargo fuzz build open
      - name: Fuzz paths (20 секунд)
        run: cargo fuzz run paths -- -max_total_time=20
      - name: Fuzz open (20 секунд)
        run: cargo fuzz run open -- -max_total_time=20
